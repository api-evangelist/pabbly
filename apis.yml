aid: pabbly
name: Pabbly
description: >-
  Pabbly is an Indian SaaS company selling a suite of marketing and sales
  software as one-time lifetime deals as well as monthly plans: Pabbly Connect
  (workflow automation), Pabbly Subscription Billing (recurring billing and
  invoicing), Pabbly Email Marketing, Pabbly Chatflow (WhatsApp Business
  messaging), Pabbly Form Builder, Pabbly Hook (an inbound webhook gateway) and
  Pabbly Email Verification. Its developer platform at apidocs.pabbly.com
  documents five REST APIs and 173 endpoints, all keyed on HTTP Basic or Bearer
  credentials generated from the account dashboard, plus a sixth Connect Platform
  API distributed only through a first-party npm SDK. Pabbly Subscription Billing
  emits 23 webhook event types, and Pabbly Connect ships a beta hosted MCP server
  that exposes a customer's own workflow actions as agent tools.
