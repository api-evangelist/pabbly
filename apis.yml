  - aid: pabbly:pabbly-connect-platform
    name: Pabbly Connect Platform API
    description: >-
      Backend-to-backend API that lets a product use Pabbly Connect as its
      connection manager — search a catalog of 1,000+ apps, mint hosted OAuth or
      credential request links for an end customer, and vend fresh access tokens.
      Bearer tenant key prefixed pk_live_ plus a required x-user-email header. Not
      documented on the developer portal; the only public reference is the
      first-party npm SDK.
    humanURL: https://www.npmjs.com/package/@pabbly/connect-platform
    baseURL: https://connect.pabbly.com/platform/v1
    tags:
      - Automation
      - OAuth
      - Integration
      - Connectivity
    properties:
      - type: SDKs
        url: https://www.npmjs.com/package/@pabbly/connect-platform
      - type: SourceCode
        url: https://www.npmjs.com/package/@pabbly/connect-platform
  - aid: pabbly:pabbly-connect-mcp
    name: Pabbly Connect MCP Server
    description: >-
      Beta hosted MCP server that exposes a Pabbly Connect user's own workflow
      action steps as agent tools. Tools are authored inside Pabbly Connect
      ("Add to MCP Server"), and the server URL is minted per account from
      Pabbly Connect MCP Settings, so no fixed public endpoint or tool catalog is
      published. A first-party stdio bridge is on npm for clients that cannot
      speak SSE.
    humanURL: https://www.pabbly.com/how-to-use-pabbly-connect-mcp-server-step-by-step-guide/
    tags:
      - MCP
      - Agents
      - Automation
