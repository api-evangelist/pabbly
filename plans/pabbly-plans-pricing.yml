notes:
  - >-
    Pabbly Subscription Billing also sells a Pro one-time lifetime tier at
    $699 / INR 62,899 between Standard and Ultimate.
  - >-
    Pabbly Hook has NO standalone plan — it ships only inside the Pabbly Plus
    bundle. Its API is therefore only reachable by Pabbly Plus customers.
  - >-
    Pabbly Email Verification is credit-based with non-expiring credits and
    custom plans above 5M emails; the per-credit table is not published as
    markdown.
  - >-
    All one-time lifetime deals carry a 30-day money-back guarantee.
  - >-
    Prices are the yearly-billing monthly-equivalent figures Pabbly publishes;
    2-year and 3-year prepay tiers are cheaper (recorded above for Pabbly Plus).
