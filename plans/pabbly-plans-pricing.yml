description: >-
  Published Pabbly plans and pricing, read from the machine-readable pricing
  markdown Pabbly serves on its commerce host (buy.pabbly.com/content/*.md,
  indexed by buy.pabbly.com/llms.txt). Pabbly sells per-product recurring plans,
  per-product one-time lifetime deals, and a Pabbly Plus bundle covering every
  product. API access is not a priced add-on — the REST API and webhooks are
  bundled into the product plans, and every documented API is usable on the
  paid tiers of its product.
provenance_note: >-
  Replaces a 2026-05-04 bulk-sweep scaffold that carried invented tiers
  (pabbly-free / pabbly-pro / pabbly-enterprise with placeholder request quotas
  and "TBD" prices). Pabbly publishes no per-request API pricing and no
  enterprise tier of that shape; every figure below is quoted from Pabbly's own
  pricing content.
api_metering:
  metered: false
  note: >-
    No API call quota, per-request price or API-specific overage is published for
    any Pabbly API. Product metering is by business unit — Connect by tasks,
    Chatflow by credits, Subscription Billing by revenue, Email Marketing by
    subscribers, Hook by events, Form Builder by forms — and API calls are not
    counted separately.
