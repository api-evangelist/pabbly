  please wait..." placeholders, so no dated entry, title or version could be
  read anonymously. No RSS/Atom feed and no JSON API were found
  (/changelog.rss, /rss, /feed, /changelog.json all 404; /api/v1/* returned the
  same SPA shell).
  Because not one dated entry could be verified, NO `ChangeLog` pointer is
  emitted in apis.yml — the surface exists but nothing about it is machine
  readable, and a pointer would credit a changelog this pass never saw.
