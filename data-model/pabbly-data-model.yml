cross_domain:
  - note: >-
      The six APIs share no identifier space and no cross-product references. A
      Subscription Billing customer_id has no relationship to a Chatflow contact
      or an Email Marketing subscriber; nothing in the documented surface joins
      them. Pabbly Connect is the intended join, and it is not one of the six
