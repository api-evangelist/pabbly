note: >-
  Derived from documented paths and worked example responses, not from an
  OpenAPI document — Pabbly publishes none. Relationships are read from
  id-bearing path parameters (e.g. GET /plans/{product_id}) and from id
  reference fields in the example payloads (customer_id, subscription_id,
  invoice_id). Field-level schemas are NOT reproduced here; only entities and
  the references between them.
identifiers:
  style: opaque
  format: 24-character hexadecimal (MongoDB ObjectId shape)
  example_field_names:
    - id
    - customer_id
    - subscription_id
    - invoice_id
    - product_id
    - plan_id
    - transaction_id
    - addon_id
    - connection_id
  prefixed: false
  note: >-
    Ids carry no type prefix, so an id alone does not tell an agent what kind of
    object it is. The docs show a placeholder "cus_example" in the auth examples,
    but every real example payload returns an unprefixed hex id.
